replicaCount: 1

image:
  repository: "534856791031.dkr.ecr.us-east-1.amazonaws.com/devops-shop"
  tag: "latest"
  digest: "sha256:d1212cf374f729975bf05060d1c2be076214052519f9e2172494a24f9173e17e"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /health

ingress:
  enabled: false
  host: devops-shop-staging.local

monitoring:
  enabled: false

serviceMonitor:
  enabled: false
  interval: 15s
  # Must match the release name of your installed kube-prometheus-stack release
  release: prometheus

alerting:
  enabled: false

  rules:
    highErrorRate:
      enabled: true
      threshold: 5
      for: 5m

    highLatency:
      enabled: true
      threshold: 0.5
      for: 5m

    appDown:
      enabled: true
      for: 2m
      
alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-slack